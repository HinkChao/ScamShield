name: Bug report
description: Report a reproducible failure without including sensitive messages
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce using synthetic input
      description: Never paste passwords, tokens, or private messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: environment
    attributes:
      label: Python version, OS, branch, and logs (redacted)
